[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musizerr-provider-acoustid"
version = "1.0.0"
description = "Identify an audio file by its fingerprint with AcoustID, as a Musizerr provider image."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-or-later"}
# pyacoustid fingerprints with the `fpcalc` program of Chromaprint, which is not a Python package: the Dockerfile
# installs it (libchromaprint-tools).
dependencies = ["musizerr-sdk>=5.4,<6", "pyacoustid==1.3.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["musizerr_provider_acoustid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
